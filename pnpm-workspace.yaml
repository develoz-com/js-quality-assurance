packages:
  - "packages/*"

minimumReleaseAgeExclude:
  - "@types/node@24.19.1"
  - eslint@10.12.0

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Optional peers (eslint/stylelint presets) must not be auto-installed; consumers
# opt in, and auto-installing them dragged the stylelint advisory chain into the
# production tree.
autoInstallPeers: false

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
