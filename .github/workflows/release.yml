# Publishes to npm through trusted publishing (OIDC). No NPM_TOKEN is used.
#
# Setup, once per package on npmjs.com (Settings -> Trusted Publisher -> GitHub Actions):
#   organization: develoz-com   repository: js-quality-assurance
#   workflow: release.yml        allowed action: npm publish
#
# `pnpm pack` is used to build tarballs because it rewrites `workspace:*`
# dependency ranges to real versions; `npm pack` leaves them intact, which
# would publish an uninstallable package. The tarballs are then published with
# npm, which performs the OIDC exchange.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Pin the 11.x line: npm 12 breaks
      # --provenance.
      - name: Pin npm
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm --recursive run build

      - name: Verify
        run: |
          pnpm --recursive run typecheck
          pnpm --recursive run test

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in packages/quality-assurance-config packages/quality-assurance; do
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          ls -l "$RUNNER_TEMP/tarballs"

      # Config is published first and the CLI is abandoned if config fails: the
      # CLI pins an exact config version, so publishing it alone would leave it
      # uninstallable.
      - name: Publish
        run: |
          set -uo pipefail

          publish() {
            local tarball="$1" manifest name version
            manifest=$(tar -xzOf "$tarball" package/package.json)
            name=$(printf '%s' "$manifest" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
            version=$(printf '%s' "$manifest" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published; skipping"
              return 0
            fi
            echo "::group::Publishing ${name}@${version}"
            npm publish "$tarball" --access public --provenance
            local rc=$?
            echo "::endgroup::"
            return $rc
          }

          config=$(ls "$RUNNER_TEMP"/tarballs/develoz-quality-assurance-config-*.tgz)
          cli=$(ls "$RUNNER_TEMP"/tarballs/develoz-quality-assurance-[0-9]*.tgz)

          if ! publish "$config"; then
            echo "::error::config publish failed; not publishing the CLI that pins it"
            exit 1
          fi
          publish "$cli"
