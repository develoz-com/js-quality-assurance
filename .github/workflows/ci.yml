name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --recursive run build

      - name: Self-lint with Biome
        run: pnpm exec biome check .

      # Dogfood the CLI on this repo. Writes SARIF/JUnit into dist/qa.
      - name: qa ci
        working-directory: packages/quality-assurance
        env:
          CI: "true"
        run: node bin/qa.js ci

      - name: Merge QA artifacts
        if: always()
        working-directory: packages/quality-assurance
        env:
          CI: "true"
        run: node bin/qa.js report

      # Code scanning requires one SARIF run per category, so each tool is a
      # separate file and a separate upload.
      - name: Upload SARIF (lint)
        if: always() && hashFiles('packages/quality-assurance/dist/qa/biome.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/quality-assurance/dist/qa/biome.sarif
          category: biome

      - name: Upload SARIF (smells)
        if: always() && hashFiles('packages/quality-assurance/dist/qa/biome-smells.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/quality-assurance/dist/qa/biome-smells.sarif
          category: biome-smells

      - name: Upload SARIF (duplication)
        if: always() && hashFiles('packages/quality-assurance/dist/qa/jscpd-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/quality-assurance/dist/qa/jscpd-report.sarif
          category: jscpd

      - name: Upload SARIF (boundaries)
        if: always() && hashFiles('packages/quality-assurance/dist/qa/dependency-cruiser.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/quality-assurance/dist/qa/dependency-cruiser.sarif
          category: boundaries

      - name: Upload SARIF (styles)
        if: always() && hashFiles('packages/quality-assurance/dist/qa/stylelint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/quality-assurance/dist/qa/stylelint.sarif
          category: stylelint

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: packages/quality-assurance/dist/qa
